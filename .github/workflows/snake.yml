name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: TashStack-18
          outputs: |
            dist/github-snake.svg?color_snake=#d946ef&color_dots=#16121f,#4c1d95,#7c3aed,#c026d3,#f472b6
            dist/github-snake-dark.svg?color_snake=#f0abfc&color_dots=#16121f,#4c1d95,#7c3aed,#c026d3,#f472b6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
